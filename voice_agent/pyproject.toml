[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[openai,silero,turn-detector,whisper]~=1.4",
    "livekit-plugins-noise-cancellation~=0.2",
    "pip-system-certs>=5.3",
    "python-dotenv",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "faster-whisper>=1.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "onnxruntime-gpu>=1.18.0",
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "onnxruntime>=1.24.3",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cudnn-cu12>=9.23.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cufft-cu12>=11.4.1.4",
    "nvidia-curand-cu12>=10.3.10.19",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]  # Line too long and default function calls (FastAPI parameters)


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
