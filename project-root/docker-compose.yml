services:

  # ─── existing services (livekit-server, postgres, thingsboard, etc.) ────────

  stt-service:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile.stt
    image: zephyr-stt:latest
    restart: always
    ports:
      - "8765:8765"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Named volume keeps model files across container restarts
      - stt-model-cache:/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - tb-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  tts-service:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile.tts
    image: zephyr-tts:latest
    restart: always
    ports:
      - "8766:8766"
    volumes:
      - tts-model-cache:/model-cache
    networks:
      - tb-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8766/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── To add GPU for TTS too, uncomment inside tts-service: ──────────────────
  # environment:
  #   - NVIDIA_VISIBLE_DEVICES=all
  # deploy:
  #   resources:
  #     reservations:
  #       devices:
  #         - driver: nvidia
  #           count: 1
  #           capabilities: [gpu]
  # Also swap onnxruntime → onnxruntime-gpu in requirements-tts.txt

volumes:
  stt-model-cache:
  tts-model-cache:
  # ... your existing volume names below

networks:
  tb-network:
    driver: bridge